# DigidreamSynth vhost for an nginx that (so far) only listens on :80 —
# name-based, so it coexists with the other services on the box. This gets
# the subdomain ROUTING immediately; browsers still need HTTPS before
# AudioWorklet/Web MIDI will start (run certbot --nginx afterwards, use a
# DNS-01 wildcard for a private domain, or reach it via an SSH tunnel).
server {
    listen 80;
    server_name synth.example.com;   # <- your subdomain

    root /srv/digidreamsynth;        # the dist-web bundle
    index index.html;

    # nginx's default mime.types has no .mjs mapping.
    types {
        text/html                 html;
        text/javascript           js mjs;
        application/json          json;
        audio/midi                mid;
        text/css                  css;
    }

    gzip on;
    gzip_types text/javascript application/json;

    location /tool/dist/ { add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
}
