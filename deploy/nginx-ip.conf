# DigidreamSynth reached by bare IP (no domain): its own port + a
# self-signed cert with the IP in the SAN. Browsers warn once per machine
# ("Advanced -> proceed"); after accepting, the origin is a secure context,
# which AudioWorklet and Web MIDI require. Generate the cert with
# deploy/make_ip_cert.sh <ip> on the server first.
server {
    listen 8443 ssl default_server;

    ssl_certificate     /etc/nginx/digidreamsynth-ip.crt;
    ssl_certificate_key /etc/nginx/digidreamsynth-ip.key;

    root /srv/digidreamsynth;
    index index.html;

    types {
        text/html                 html;
        text/javascript           js mjs;
        application/json          json;
        audio/midi                mid;
        text/css                  css;
    }

    gzip on;
    gzip_types text/javascript application/json;

    location /tool/dist/ { add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
}
