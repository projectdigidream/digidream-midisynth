# DigidreamSynth static hosting (dist-web bundle).
#
# Requirements: HTTPS (AudioWorklet + Web MIDI need a secure context) and
# .mjs served as JavaScript. No COOP/COEP needed. Everything is immutable
# static content except during redeploys.
server {
    listen 443 ssl http2;
    server_name synth.example.com;

    # ssl_certificate     /etc/letsencrypt/live/synth.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/synth.example.com/privkey.pem;

    root /srv/digidreamsynth;   # the dist-web bundle
    index index.html;

    types {
        text/html                 html;
        text/javascript           js mjs;
        application/json          json;
        audio/midi                mid;
        application/wasm          wasm;
        text/css                  css;
    }

    gzip on;
    gzip_types text/javascript application/json;

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
    # The engine module is the big file; let browsers cache it per deploy.
    location /tool/dist/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
server {
    listen 80;
    server_name synth.example.com;
    return 301 https://$host$request_uri;
}
